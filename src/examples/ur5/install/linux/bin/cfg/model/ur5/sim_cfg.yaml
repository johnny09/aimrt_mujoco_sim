aimrt:
  plugin:
    plugins:
      # - name: net_plugin
      #   path: ./libaimrt_net_plugin.so
      #   options:
      #     thread_num: 4
      #     http_options:
      #       listen_ip: 127.0.0.1
      #       listen_port: 50080
      - name: zenoh_plugin
        path: ./libaimrt_zenoh_plugin.so
        options: 
          shm_pool_size: 502400
  log:
    core_lvl: INFO # Trace/Debug/Info/Warn/Error/Fatal/Off
    backends:
      - type: console
  executor:
    executors:
      - name: gui_thread
        type: simple_thread
      - name: work_thread_pool
        type: asio_thread
        options:
          thread_num: 4
  channel:
    backends:
      - type: zenoh
        options:
          pub_topics_options:
            - topic_name: "(.*)"
              shm_enabled: true
    sub_topics_options:
      - topic_name: "(.*)"
        enable_backends: [zenoh]
    pub_topics_options:
      - topic_name: "(.*)"
        enable_backends: [zenoh]
  rpc:
    backends:
      - type: zenoh
    servers_options:
      - func_name: "(.*)"
        enable_backends: [zenoh]
        enable_filters: [debug_log]
  module:
    pkgs:
      - path: ./libmujoco_sim_pkg.so
        enable_modules: [MujocoSimModule]
    modules:
      - name: MujocoSimModule
        log_lvl: INFO

# Module custom configuration
MujocoSimModule:
  simulation_model_path: ./cfg/model/ur5/sim_scene.xml
  sim_executor: work_thread_pool
  gui_executor: gui_thread
  subscriber_options:
    - topic: /ur5/joint_command
      type: joint_actuator
      options:
        joints:
          - name: shoulder_pan_joint
            bind_joint: shoulder_pan_joint
          - name: shoulder_lift_joint
            bind_joint: shoulder_lift_joint
          - name: elbow_joint
            bind_joint: elbow_joint
          - name: wrist_1_joint
            bind_joint: wrist_1_joint
          - name: wrist_2_joint
            bind_joint: wrist_2_joint
          - name: wrist_3_joint
            bind_joint: wrist_3_joint
  publisher_options:
    - topic: /ur5/joint_state
      frequency: 500
      executor: work_thread_pool
      type: joint_sensor
      options:
        joints:
          - name: shoulder_pan_joint_sensor
            bind_joint: shoulder_pan_joint
          - name: shoulder_lift_joint_sensor
            bind_joint: shoulder_lift_joint
          - name: elbow_joint_sensor
            bind_joint: elbow_joint
          - name: wrist_1_joint_sensor
            bind_joint: wrist_1_joint
          - name: wrist_2_joint_sensor
            bind_joint: wrist_2_joint
          - name: wrist_3_joint_sensor
            bind_joint: wrist_3_joint