aimrt:
  plugin:
    plugins:
      - name: net_plugin
        path: ./libaimrt_net_plugin.so
        options:
          thread_num: 4
          http_options:
            listen_ip: 127.0.0.1
            listen_port: 50080
  log:
    core_lvl: INFO # Trace/Debug/Info/Warn/Error/Fatal/Off
    backends:
      - type: console
  executor:
    executors:
      - name: gui_thread
        type: simple_thread
      - name: work_thread_pool
        type: asio_thread
        options:
          thread_num: 4
  channel:
    backends:
      - type: local
        options:
          subscriber_use_inline_executor: false
          subscriber_executor: work_thread_pool
    sub_topics_options:
      - topic_name: "(.*)"
        enable_backends: [local]
    pub_topics_options:
      - topic_name: "(.*)"
        enable_backends: [local]
  rpc:
    backends:
      - type: http
    servers_options:
      - func_name: "(.*)"
        enable_backends: [http]
        enable_filters: [debug_log]
  module:
    pkgs:
      - path: ./libmujoco_sim_pkg.so
        enable_modules: [MujocoSimModule]
      - path: ./libinverted_pendulum_pkg.so
        enable_modules: [PidControlModule]
    modules:
      - name: MujocoSimModule
        log_lvl: INFO
      - name: PidControlModule
        log_lvl: INFO

# Module custom configuration
MujocoSimModule:
  simulation_model_path: ./cfg/model/scene.xml
  sim_executor: work_thread_pool
  gui_executor: gui_thread
  subscriber_options:
    - topic: /ur5/joint_command
      type: joint_actuator
      options:
        joints:
          - name: shoulder_pan_joint
            bind_joint: shoulder_pan_joint
          - name: shoulder_lift_joint
            bind_joint: shoulder_lift_joint
          - name: elbow_joint
            bind_joint: elbow_joint
          - name: wrist_1_joint
            bind_joint: wrist_1_joint
          - name: wrist_2_joint
            bind_joint: wrist_2_joint
          - name: wrist_3_joint
            bind_joint: wrist_3_joint
  publisher_options:
    - topic: /ur5/joint_state
      frequency: 1000
      executor: work_thread_pool
      type: joint_sensor
      options:
        joints:
          - name: shoulder_pan_joint_sensor
            bind_joint: shoulder_pan_joint
          - name: shoulder_lift_joint_sensor
            bind_joint: shoulder_lift_joint
          - name: elbow_joint_sensor
            bind_joint: elbow_joint
          - name: wrist_1_joint_sensor
            bind_joint: wrist_1_joint
          - name: wrist_2_joint_sensor
            bind_joint: wrist_2_joint
          - name: wrist_3_joint_sensor
            bind_joint: wrist_3_joint

PidControlModule:
  topic_name_sub: /ur5/joint_state
  topic_name_pub: /ur5/joint_command
  init_kp: 22000
  init_ki: 0
  init_kd: 120
